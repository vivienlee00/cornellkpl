<!DOCTYPE HTML>
<html>

<head>
  <title>Active Sisters 💎 Cornell ΚΦΛ</title>
  <meta charset="utf-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, user-scalable=no"
  />

  <link rel="stylesheet" href="assets/css/main.css" />

  <noscript>
    <link rel="stylesheet" href="assets/css/noscript.css" />
  </noscript>

  <style>
    .container {
      position: relative;
      max-height: 450px;
      box-shadow:
        0 4px 8px 0 rgba(0, 0, 0, 0.2),
        0 6px 20px 0 rgba(0, 0, 0, 0.19);
      border-radius: 7px;
    }

    .col-3 {
      padding: 0 0 1em 1em !important;
    }

    .image {
      display: block;
      width: 100%;
      height: 450px;
      object-fit: cover;
      border-radius: 8px;
    }

    .overlay {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      right: 0;
      height: 100%;
      width: 100%;
      opacity: 0;
      transition: 0.3s ease;
      background-color: rgba(0, 0, 0, 0.85);
      border-radius: 7px;
    }

    .container:hover .overlay {
      opacity: 1;
    }

    .container .text {
      color: white;
      font-size: 20px;
      position: absolute;
      margin: 15px;
    }

    .sisterDesc {
      color: white;
      font-size: 16px;
    }

    .tablink:hover {
      background-color: rgba(41, 0, 0, 0.699);
    }

    .tablink {
      height: auto;
      line-height: 1.3em;
      padding: 0.8em 2em;
    }

    .tabcontent {
      display: none;
    }

    .inner {
      padding: 3em 0 2em 0 !important;
    }
  </style>
</head>

<body class="is-preload">

  <!-- Wrapper -->
  <div id="wrapper">

    <!-- Header -->
    <header id="header">
      <a href="/" class="logo"></a>

      <nav>
        <a href="#menu">Menu</a>
      </nav>
    </header>

    <!-- Menu -->
    <nav id="menu">
      <ul class="links">
        <li>
          <a href="/">Home</a>
        </li>

        <li>
          <a href="rush">Rush</a>
        </li>

        <li>
          <a href="actives">Active Sisters</a>
        </li>

        <li>
          <a href="roster">Full Roster</a>
        </li>

        <li>
          <a href="about">About Kappas</a>
        </li>
      </ul>

      <ul class="actions stacked">
        <li>
          <a href="contact" class="button primary fit">
            Contact Us
          </a>
        </li>
      </ul>
    </nav>

    <!-- Main -->
    <div id="main" class="alt">

      <!-- Active Sisters -->
      <section id="one">
        <div class="inner" style="max-width: 70em;">

          <h1 style="margin-bottom: 45px;">
            Active Sisters
          </h1>

          <!-- Class selection buttons -->
          <div
            id="class_select"
            class="row"
            style="
              margin-bottom: 50px;
              justify-content: center;
            "
          >
            <button
              class="tablink button small"
              onclick="openPage('ANu', this, 'white')"
              id="defaultOpen"
            >
              Spring '24<br>
              iota Alpha Nu
            </button>

            <button
              class="tablink button small"
              onclick="openPage('AOmicron', this, 'white')"
            >
              Spring '25<br>
              iota Alpha Omicron
            </button>

            <button
              class="tablink button small"
              onclick="openPage('APi', this, 'white')"
            >
              Fall '25<br>
              iota Alpha Pi
            </button>

            <button
              class="tablink button small"
              onclick="openPage('ARho', this, 'white')"
            >
              Spring '26<br>
              iota Alpha Rho
            </button>
          </div>

          <!-- Alpha Nu -->
          <div id="ANu" class="tabcontent">
            <div class="row">
            </div>
          </div>

          <!-- Alpha Omicron -->
          <div id="AOmicron" class="tabcontent">
            <div class="row">
            </div>
          </div>

          <!-- Alpha Pi -->
          <div id="APi" class="tabcontent">
            <div class="row">
            </div>
          </div>

          <!-- Alpha Rho -->
          <div id="ARho" class="tabcontent">
            <div class="row">
            </div>
          </div>

        </div>
      </section>

      <!-- Footer -->
      <footer id="footer">
        <div class="inner">

          <ul class="icons">
            <li>
              <a
                href="https://www.facebook.com/cornellkpl"
                class="icon brands fa-facebook-f"
              >
                <span class="label">Facebook</span>
              </a>
            </li>

            <li>
              <a
                href="https://www.instagram.com/cornellkpl/"
                class="icon brands fa-instagram"
              >
                <span class="label">Instagram</span>
              </a>
            </li>

            <li>
              <a
                href="https://www.youtube.com/user/cornellkappas"
                class="icon brands fa-youtube"
              >
                <span class="label">Youtube</span>
              </a>
            </li>

            <li>
              <a href="contact" class="button small next">
                contact us &nbsp;
              </a>
            </li>
          </ul>

          <ul class="copyright">
            <li>
              &copy; 2020 Cornell University ΚΦΛ
              Kappa Phi Lambda Sorority, Incorporated
              <br>
              Vivien Lee *clytemnestra* SPR19
            </li>
          </ul>

        </div>
      </footer>

    </div>
  </div>

  <!-- Scripts -->
  <script src="assets/js/jquery.min.js"></script>
  <script src="assets/js/jquery.scrolly.min.js"></script>
  <script src="assets/js/jquery.scrollex.min.js"></script>
  <script src="assets/js/browser.min.js"></script>
  <script src="assets/js/breakpoints.min.js"></script>
  <script src="assets/js/util.js"></script>
  <script src="assets/js/main.js"></script>

  <script src="assets/js/FA26activesisters.js"></script>

</body>

</html>
